# Hooks locais: usam as ferramentas do requirements-dev.txt (mesmas versões do CI).
# Instalação: pip install -r requirements-dev.txt && pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (domínio strict)
        entry: mypy
        language: system
        pass_filenames: false
        files: ^backend/app/
      - id: import-linter
        name: import-linter (fronteiras de camada e contexto)
        entry: env PYTHONPATH=backend lint-imports
        language: system
        pass_filenames: false
        files: ^backend/app/
      - id: nada-de-dominio-antigo
        name: nenhuma referência ao domínio antigo
        entry: scripts/checar_dominio_antigo.sh
        language: system
        pass_filenames: false
        always_run: true
