name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Banco descartável só para verificar as migrações no mesmo motor da produção.
      # A senha não é segredo: o container nasce e morre dentro do job, sem porta fora do runner.
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-descartavel
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar segredos descartáveis do teste
        run: |
          echo "CI_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CI_LOG_TOKEN=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "CI_GARAGE_RPC_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CI_STORAGE_ACCESS_KEY=GK$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "CI_STORAGE_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Dependências de desenvolvimento
        run: pip install -r requirements-dev.txt

      - name: Lint e formatação (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tipos (mypy, strict no domínio)
        run: mypy

      - name: Fronteiras de camada e contexto (import-linter)
        run: PYTHONPATH=backend lint-imports

      - name: Nenhuma referência ao domínio antigo
        run: scripts/checar_dominio_antigo.sh

      - name: Testes (pytest)
        run: pytest -q

      - name: Migrações no MariaDB 11.8 (Alembic, db/*.sql e seed)
        env:
          MARIADB_URL: mysql+pymysql://root:ci-descartavel@127.0.0.1:3306
          PYTHON: python
        run: scripts/verificar_migracoes.sh

      - name: Build e subida da stack (espera todos ficarem healthy)
        run: docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 240

      - name: Teste 1 - /health/ready da api responde 200
        run: curl --fail --silent --show-error http://localhost:8000/health/ready

      - name: Teste 2 - a cadeia api → auth → banco responde
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -d "username=naoexiste@teste.com&password=errada" \
            http://localhost:8000/api/auth/login)
          echo "login inexistente retornou $code"
          test "$code" = "401"

      - name: Teste 3 - /metrics da api expõe métricas Prometheus
        run: curl --fail --silent http://localhost:8000/metrics | grep -q http_requests_total

      - name: Teste 4 - ponte /storage existe e recusa URL sem assinatura
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/storage/catalogo-avatares/x.webp)
          echo "/storage sem assinatura retornou $code"
          test "$code" = "403"

      - name: Logs dos containers em caso de falha
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs

      - name: Derrubar stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: nivelo-api, context: ".", file: "Dockerfile" }
          - { name: nivelo-auth-service, context: "./auth-service", file: "auth-service/Dockerfile" }
          - { name: nivelo-log-service, context: "./log-service", file: "log-service/Dockerfile" }
          - { name: nivelo-prometheus, context: "./prometheus", file: "prometheus/Dockerfile" }
          - { name: nivelo-grafana, context: "./grafana", file: "grafana/Dockerfile" }
          - { name: nivelo-garage, context: "./garage", file: "garage/Dockerfile" }
    steps:
      - uses: actions/checkout@v4

      - name: Variáveis de tag (dono em minúsculas é exigido pelo GHCR)
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ matrix.name }}:sha-${{ env.SHORT_SHA }}
            ghcr.io/${{ env.OWNER }}/${{ matrix.name }}:latest
