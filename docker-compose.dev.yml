# docker-compose.dev.yml — Desenvolvimento Local
# Usa os Dockerfiles locais em vez das imagens publicadas no GHCR.
# NUNCA use este arquivo em produção.
#
# Como usar:
#   docker compose -f docker-compose.dev.yml up --build
#
# Para parar:
#   docker compose -f docker-compose.dev.yml down
#
# Webhooks do Stripe em dev (Atividade 7) — sobe também a Stripe CLI:
#   docker compose -f docker-compose.dev.yml --profile stripe up --build

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nivelo-api-dev
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      - PORT=8000
      - AUTH_SERVICE_URL=http://auth-service-dev:8001
      - LOG_SERVICE_URL=http://log-service:8002
      - LOG_INTERNAL_TOKEN=${LOG_INTERNAL_TOKEN}
      - STORAGE_ENDPOINT=http://garage:3900
      - STORAGE_REGION=garage
      - STORAGE_BUCKET=${STORAGE_BUCKET:-catalogo-avatares}
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY}
      - STORAGE_BANDA_MINIMA_KBPS=${STORAGE_BANDA_MINIMA_KBPS:-256}
      - STORAGE_MARGEM_USO_SEGUNDOS=${STORAGE_MARGEM_USO_SEGUNDOS:-600}
      - STORAGE_EXPIRACAO_MAX_SEGUNDOS=${STORAGE_EXPIRACAO_MAX_SEGUNDOS:-3600}
      - PERFIL_FOTO_MAX_BYTES=${PERFIL_FOTO_MAX_BYTES:-2097152}
      # Plano Premium (Stripe em modo de teste). Sem as chaves, checkout/webhook respondem 503.
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8000}
      - AUTH_INTERNAL_TOKEN=${AUTH_INTERNAL_TOKEN:-}
      # Dados de desenvolvimento (db/900_seed_dev.sql). Nunca true em produção.
      - SEED=${SEED:-false}
      - APP_ENV=${APP_ENV:-development}
    depends_on:
      auth-service:
        condition: service_healthy
      log-service:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - nivelo-network-dev
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service-dev
    expose:
      - "8001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      - PORT=8001
      - MAILTRAP_HOST=${MAILTRAP_HOST:-sandbox.smtp.mailtrap.io}
      - MAILTRAP_PORT=${MAILTRAP_PORT:-2525}
      - MAILTRAP_USERNAME=${MAILTRAP_USERNAME:-}
      - MAILTRAP_PASSWORD=${MAILTRAP_PASSWORD:-}
      - MAILTRAP_FROM_EMAIL=${MAILTRAP_FROM_EMAIL:-nao-responda@nivelo.app}
      - MAILTRAP_FROM_NAME=${MAILTRAP_FROM_NAME:-Nivelo}
      - CATALOGO_URL=${CATALOGO_URL:-http://localhost:8000}
      - RESET_TOKEN_EXPIRE_MINUTES=${RESET_TOKEN_EXPIRE_MINUTES:-30}
      - RESET_REQUEST_LIMIT=${RESET_REQUEST_LIMIT:-3}
      - RESET_REQUEST_WINDOW_MINUTES=${RESET_REQUEST_WINDOW_MINUTES:-15}
      - EMAIL_LOG_LINK_WITHOUT_SMTP=${EMAIL_LOG_LINK_WITHOUT_SMTP:-false}
      - AUTH_INTERNAL_TOKEN=${AUTH_INTERNAL_TOKEN:-}
      # Admin da plataforma, criado no primeiro boot (nunca pelo cadastro público)
      # URL pública usada nos links dos e-mails (convite); vazio = usa CATALOGO_URL
      - APP_BASE_URL=${APP_BASE_URL:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_SENHA_INICIAL=${ADMIN_SENHA_INICIAL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - nivelo-network-dev
    restart: unless-stopped

  log-service:
    build:
      context: ./log-service
      dockerfile: Dockerfile
    container_name: log-service-dev
    expose:
      - "8002"                # Sem "ports:" — não é publicado no host
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_INTERNAL_TOKEN=${LOG_INTERNAL_TOKEN}
      - PORT=8002
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - nivelo-network-dev
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    # Sem "ports:" — só o log-service acessa o Redis, pela rede interna
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - nivelo-network-dev
    restart: unless-stopped

  garage:
    build:
      context: ./garage
      dockerfile: Dockerfile
    container_name: garage-dev
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE_DEFAULT_ACCESS_KEY=${STORAGE_ACCESS_KEY}
      - GARAGE_DEFAULT_SECRET_KEY=${STORAGE_SECRET_KEY}
      - GARAGE_DEFAULT_BUCKET=${STORAGE_BUCKET:-catalogo-avatares}
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    expose:
      - "3900"            # Sem "ports:" — acesso do navegador via /storage na api
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - nivelo-network-dev
    restart: unless-stopped

  # Stripe CLI (só dev): escuta os eventos da conta de TESTE e encaminha para o webhook
  # da API pela rede interna. Ao subir, imprime "Ready! Your webhook signing secret
  # is <segredo>" — esse valor vai em STRIPE_WEBHOOK_SECRET (e a API precisa ser
  # recriado para ler o novo valor). Fica atrás do profile "stripe" para não subir
  # em loop de erro quando não há chave configurada.
  stripe-cli:
    image: stripe/stripe-cli:v1.52.1
    profiles: ["stripe"]
    command:
      - listen
      - --api-key
      - ${STRIPE_SECRET_KEY:-}
      - --events
      - checkout.session.completed,customer.subscription.deleted,invoice.payment_failed
      - --forward-to
      - http://api:8000/webhooks/stripe
    depends_on:
      api:
        condition: service_healthy
    networks:
      - nivelo-network-dev
    restart: unless-stopped

  prometheus:
    build:
      context: ./prometheus
      dockerfile: Dockerfile
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - api
      - auth-service
      - log-service
    networks:
      - nivelo-network-dev
    restart: unless-stopped

  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - nivelo-network-dev
    restart: unless-stopped

networks:
  nivelo-network-dev:
    driver: bridge

volumes:
  redis-data:
  grafana-data:
  garage-meta:
  garage-data:
