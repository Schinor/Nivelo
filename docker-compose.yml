services:
  api:
    image: ghcr.io/schinor/nivelo-api:${IMAGE_TAG:-latest}
    mem_limit: 1g             # regra da infra: no máximo 1 GB por container
    container_name: nivelo-api-schinor
    ports:
      # Se a porta 8000 já estiver em uso por outro aluno, troque a porta da esquerda (ex: 8050:8000)
      - "${PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      - PORT=8000
      - AUTH_SERVICE_URL=http://auth-service-schinor:8001
      - LOG_SERVICE_URL=http://log-service:8002
      - LOG_INTERNAL_TOKEN=${LOG_INTERNAL_TOKEN}
      - GRAFANA_INTERNAL_URL=http://grafana:3000
      - PROMETHEUS_INTERNAL_URL=http://prometheus:9090
      - PROMETHEUS_PROXY_PASSWORD=${PROMETHEUS_PROXY_PASSWORD}
      - STORAGE_ENDPOINT=http://garage:3900
      - STORAGE_REGION=garage
      - STORAGE_BUCKET=${STORAGE_BUCKET:-catalogo-avatares}
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY}
      - STORAGE_BANDA_MINIMA_KBPS=${STORAGE_BANDA_MINIMA_KBPS:-256}
      - STORAGE_MARGEM_USO_SEGUNDOS=${STORAGE_MARGEM_USO_SEGUNDOS:-600}
      - STORAGE_EXPIRACAO_MAX_SEGUNDOS=${STORAGE_EXPIRACAO_MAX_SEGUNDOS:-3600}
      - PERFIL_FOTO_MAX_BYTES=${PERFIL_FOTO_MAX_BYTES:-2097152}
      # Plano Premium (Stripe em modo de teste). Sem as chaves, checkout/webhook respondem 503.
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID:-}
      # Preços dos planos pagos (Fase 9); vazios até lá
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO:-}
      - STRIPE_PRICE_CONSTRUTORA=${STRIPE_PRICE_CONSTRUTORA:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8000}
      - AUTH_INTERNAL_TOKEN=${AUTH_INTERNAL_TOKEN:-}
      # Dados de desenvolvimento (db/900_seed_dev.sql). Nunca true em produção.
      - SEED=${SEED:-false}
      # Com production, o seed se recusa a rodar e o boot falha
      - APP_ENV=${APP_ENV:-production}
    depends_on:
      auth-service:
        condition: service_healthy
      log-service:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - nivelo-network
    restart: unless-stopped

  auth-service:
    image: ghcr.io/schinor/nivelo-auth-service:${IMAGE_TAG:-latest}
    mem_limit: 1g             # regra da infra: no máximo 1 GB por container
    container_name: auth-service-schinor
    expose:
      - "8001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      - PORT=8001
      - MAILTRAP_HOST=${MAILTRAP_HOST:-sandbox.smtp.mailtrap.io}
      - MAILTRAP_PORT=${MAILTRAP_PORT:-2525}
      - MAILTRAP_USERNAME=${MAILTRAP_USERNAME:-}
      - MAILTRAP_PASSWORD=${MAILTRAP_PASSWORD:-}
      - MAILTRAP_FROM_EMAIL=${MAILTRAP_FROM_EMAIL:-nao-responda@nivelo.app}
      - MAILTRAP_FROM_NAME=${MAILTRAP_FROM_NAME:-Nivelo}
      - CATALOGO_URL=${CATALOGO_URL:-http://localhost:8000}
      - RESET_TOKEN_EXPIRE_MINUTES=${RESET_TOKEN_EXPIRE_MINUTES:-30}
      - RESET_REQUEST_LIMIT=${RESET_REQUEST_LIMIT:-3}
      - RESET_REQUEST_WINDOW_MINUTES=${RESET_REQUEST_WINDOW_MINUTES:-15}
      - EMAIL_LOG_LINK_WITHOUT_SMTP=${EMAIL_LOG_LINK_WITHOUT_SMTP:-false}
      - AUTH_INTERNAL_TOKEN=${AUTH_INTERNAL_TOKEN:-}
      # Admin da plataforma, criado no primeiro boot (nunca pelo cadastro público)
      # URL pública usada nos links dos e-mails (convite); vazio = usa CATALOGO_URL
      - APP_BASE_URL=${APP_BASE_URL:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_SENHA_INICIAL=${ADMIN_SENHA_INICIAL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - nivelo-network
    restart: unless-stopped

  log-service:
    image: ghcr.io/schinor/nivelo-log-service:${IMAGE_TAG:-latest}
    mem_limit: 1g             # regra da infra: no máximo 1 GB por container
    container_name: log-service-schinor
    expose:
      - "8002"                # Sem "ports:" — não é publicado no host
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_INTERNAL_TOKEN=${LOG_INTERNAL_TOKEN}
      - PORT=8002
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - nivelo-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    mem_limit: 1g             # regra da infra: no máximo 1 GB por container
    command: ["redis-server", "--appendonly", "yes"]
    # Sem "ports:" — só o log-service acessa o Redis, pela rede interna
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - nivelo-network
    restart: unless-stopped

  garage:
    image: ghcr.io/schinor/nivelo-garage:${IMAGE_TAG:-latest}
    mem_limit: 1g             # regra da infra: no máximo 1 GB por container
    container_name: garage-schinor
    # --single-node: layout de 1 nó automático
    # --default-bucket: cria chave de acesso + bucket a partir das variáveis (idempotente no restart)
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE_DEFAULT_ACCESS_KEY=${STORAGE_ACCESS_KEY}
      - GARAGE_DEFAULT_SECRET_KEY=${STORAGE_SECRET_KEY}
      - GARAGE_DEFAULT_BUCKET=${STORAGE_BUCKET:-catalogo-avatares}
    # garage.toml vem embutido na imagem (garage/Dockerfile), igual ao prometheus.yml
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    expose:
      - "3900"            # Sem "ports:" — só a rede interna enxerga (acesso do navegador via /storage na api)
    healthcheck:
      # imagem sem shell/curl: usa o próprio binário
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - nivelo-network
    restart: unless-stopped

  prometheus:
    image: ghcr.io/schinor/nivelo-prometheus:${IMAGE_TAG:-latest}
    mem_limit: 1g             # regra da infra: no máximo 1 GB por container
    # --web.external-url: portas dedicadas (9090) não chegam pelo proxy do domínio público
    # (ver /prometheus na api), então os links gerados pelo próprio Prometheus
    # precisam já vir com esse prefixo. --web.route-prefix mantém as rotas internas
    # na raiz, que é o que o proxy da api espera ao encaminhar as requisições.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.external-url=/prometheus/"
      - "--web.route-prefix=/"
    # Sem "ports:" — a porta dedicada não chega pelo domínio público e, no host
    # compartilhado do Portainer, publicar 9090 conflita com a stack de outro aluno
    # ("port is already allocated") e o container nem sobe. Acesso: /prometheus na api.
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - api
      - auth-service
      - log-service
    networks:
      - nivelo-network
    restart: unless-stopped

  grafana:
    image: ghcr.io/schinor/nivelo-grafana:${IMAGE_TAG:-latest}
    mem_limit: 1g             # regra da infra: no máximo 1 GB por container
    # Sem "ports:" pelo mesmo motivo do Prometheus — acesso via /grafana na api.
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      # ROOT_URL só define os links gerados (/grafana/...). Sem SERVE_FROM_SUB_PATH:
      # o proxy da api já remove o prefixo /grafana, então o Grafana serve na raiz.
      # Com ele ligado, toda requisição sem o prefixo era redirecionada para ROOT_URL (loop).
      # CATALOGO_URL precisa ser a URL pública (https://...) — senão o login cai em localhost.
      - GF_SERVER_ROOT_URL=${CATALOGO_URL:-http://localhost:8000}/grafana/
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - prometheus
    networks:
      - nivelo-network
    restart: unless-stopped

networks:
  nivelo-network:
    driver: bridge
    ipam:
      driver: default
      config:
        # Sub-rede fixa: evita a alocação automática do Docker, cujo pool de
        # redes pré-definidas ("predefined address pools") já foi esgotado
        # no host compartilhado entre os alunos. Se o deploy falhar com
        # "Pool overlaps with other one on this address space", troque o
        # segundo octeto (ex: 10.21.30.0/28) até não colidir com a de outro aluno.
        - subnet: 10.20.30.0/28

volumes:
  redis-data:
  grafana-data:
  garage-meta:
  garage-data:
