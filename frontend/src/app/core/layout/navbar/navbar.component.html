@if (auth.isLoggedIn()) {
  <nav class="navbar" aria-label="Principal">
    <a class="navbar-brand" routerLink="/obras">
      <span class="brand-title">Nivelo</span>
      @if (auth.contexto(); as ctx) {
        <span class="brand-subtitle" title="Empresa ativa">{{ ctx.empresa_nome }}</span>
      } @else {
        <span class="brand-subtitle">Diário de obra</span>
      }
    </a>
    <div class="navbar-links">
      @if (!auth.isAdmin()) {
        <a routerLink="/obras" routerLinkActive="active"><span aria-hidden="true">🏗️</span>Obras</a>
      }
      @if (auth.ehDono()) {
        <a routerLink="/equipe" routerLinkActive="active"><span aria-hidden="true">👥</span>Equipe</a>
        <a routerLink="/assinatura" routerLinkActive="active"><span aria-hidden="true">⭐</span>Plano</a>
      }
      @if (auth.isAdmin()) {
        <a routerLink="/usuarios" routerLinkActive="active"><span aria-hidden="true">🛡️</span>Usuários</a>
      }
      <a routerLink="/perfil" routerLinkActive="active"><span aria-hidden="true">🙂</span>Perfil</a>
    </div>
    <div class="navbar-user">
      <span class="user-role-badge" [ngClass]="roleBadge.class"><i></i>{{ roleBadge.name }}</span>
      <button class="btn-logout" (click)="logout()">Sair</button>
    </div>
  </nav>
}
