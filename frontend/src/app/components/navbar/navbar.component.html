@if (auth.isLoggedIn()) {
  <nav class="navbar">
    <div class="navbar-brand" routerLink="/">
      <span class="brand-title">Nivelo</span>
      <span class="brand-subtitle">Diário de obra</span>
    </div>
    <div class="navbar-links">
      <a routerLink="/obras" routerLinkActive="active">Obras</a>
      <a routerLink="/perfil" routerLinkActive="active">Meu perfil</a>
      <a *hasPermission="'gerenciar:usuarios'" routerLink="/usuarios" routerLinkActive="active">Usuários</a>
    </div>
    <div class="navbar-user">
      <div class="user-badge-container">
        <a class="user-name" routerLink="/perfil">{{ auth.user()?.nome }}</a>
        <span class="user-role-badge" [ngClass]="roleBadge.class"><i></i>{{ roleBadge.name }}</span>
      </div>
      <button class="btn-logout" (click)="logout()">Sair</button>
    </div>
  </nav>
}
